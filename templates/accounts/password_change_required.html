{% extends "base.html" %}

{% block title %}Cambiar contraseña | SUMITEC{% endblock %}

{% block content %}
<section class="auth-layout">
    <div class="auth-panel">
        <div class="section-heading">
            <p>Seguridad</p>
            <h1>Cambiar contraseña</h1>
        </div>

        <form method="post" class="form-stack" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <label>
                    {{ field.label }}
                    {{ field }}
                    {{ field.errors }}
                </label>
            {% endfor %}
            <button type="submit" class="primary-button">Guardar contraseña</button>
        </form>
    </div>
</section>
{% endblock %}
