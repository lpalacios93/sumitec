{% extends "base.html" %}

{% block title %}{% if object %}Editar producto{% else %}Crear producto{% endif %} | SUMITEC{% endblock %}

{% block content %}
<section class="page-heading">
    <div>
        <p>Catalogo</p>
        <h1>{% if object %}Editar producto{% else %}Crear producto{% endif %}</h1>
    </div>
    <a class="secondary-link-button" href="{% url 'catalog:products' %}">Volver</a>
</section>

<section class="form-panel">
    <form method="post" enctype="multipart/form-data" class="form-grid" novalidate>
        {% csrf_token %}

        <label>
            {{ form.code.label }}
            {{ form.code }}
            {{ form.code.errors }}
        </label>
        <label>
            {{ form.barcode.label }}
            {{ form.barcode }}
            {{ form.barcode.errors }}
        </label>
        <label class="span-2">
            {{ form.description.label }}
            {{ form.description }}
            {{ form.description.errors }}
        </label>

        <label>
            {{ form.brand.label }}
            <span class="select-with-action">
                {{ form.brand }}
                <button type="button" data-picker-url="{% url 'catalog:picker' 'marcas' %}?field_id=id_brand">Elegir</button>
            </span>
            {{ form.brand.errors }}
        </label>
        <label>
            {{ form.model.label }}
            {{ form.model }}
            {{ form.model.errors }}
        </label>
        <label>
            {{ form.category.label }}
            <span class="select-with-action">
                {{ form.category }}
                <button type="button" data-picker-url="{% url 'catalog:picker' 'categorias' %}?field_id=id_category">Elegir</button>
            </span>
            {{ form.category.errors }}
        </label>
        <label>
            {{ form.supplier.label }}
            <span class="select-with-action">
                {{ form.supplier }}
                <button type="button" data-picker-url="{% url 'catalog:picker' 'proveedores' %}?field_id=id_supplier">Elegir</button>
            </span>
            {{ form.supplier.errors }}
        </label>

        <label>
            {{ form.cost_price.label }}
            {{ form.cost_price }}
            {{ form.cost_price.errors }}
        </label>
        <label>
            {{ form.sale_price.label }}
            {{ form.sale_price }}
            {{ form.sale_price.errors }}
        </label>
        <label>
            {{ form.applies_iva.label }}
            {{ form.applies_iva }}
            {{ form.applies_iva.errors }}
        </label>
        <label>
            {{ form.is_active.label }}
            {{ form.is_active }}
            {{ form.is_active.errors }}
        </label>
        <label>
            {{ form.warranty.label }}
            {{ form.warranty }}
            {{ form.warranty.errors }}
        </label>
        <label>
            {{ form.image.label }}
            {{ form.image }}
            {{ form.image.errors }}
        </label>
        <label class="span-2">
            {{ form.notes.label }}
            {{ form.notes }}
            {{ form.notes.errors }}
        </label>

        <div class="inline-management span-2">
            <span>Bodegas</span>
            <button type="button" data-picker-url="{% url 'catalog:picker' 'bodegas' %}">Administrar bodegas</button>
        </div>

        <div class="form-actions span-2">
            <button type="submit" class="primary-button">Guardar producto</button>
            <a class="secondary-link-button" href="{% url 'catalog:products' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
