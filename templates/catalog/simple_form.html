{% extends "base.html" %}

{% block title %}{{ title }} | SUMITEC{% endblock %}

{% block content %}
<section class="page-heading">
    <div>
        <p>Catalogo</p>
        <h1>{{ title }}</h1>
    </div>
    <a class="secondary-link-button" href="{% url list_url_name %}">Volver</a>
</section>

<section class="form-panel">
    <form method="post" class="form-grid" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <label class="{% if field.name == 'description' or field.name == 'address' or field.name == 'notes' %}span-2{% endif %}">
                {{ field.label }}
                {{ field }}
                {{ field.errors }}
            </label>
        {% endfor %}
        <div class="form-actions span-2">
            <button type="submit" class="primary-button">Guardar</button>
            <a class="secondary-link-button" href="{% url list_url_name %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
